aid: web-of-science-apis
name: Web of Science APIs
description: >-
  The Web of Science APIs provide programmatic access to Clarivate's Web of Science databases, the world's leading
  citation index covering over 21,000 peer-reviewed journals across the sciences, social sciences, and humanities. The
  API suite includes the Starter API for basic bibliographic metadata and journal discovery, and the Expanded API for
  advanced search, citation tracking, related records, and bibliometric reporting with h-index and year-by-year citation
  analysis.
