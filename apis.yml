  - type: Features
    data:
      - name: Advanced Document Search
        description: >-
          Search over 100 million records using Web of Science Advanced Query Syntax with 16 searchable field tags
          including topic, author, DOI, organization, and funding agency.
      - name: Citation Tracking
        description: >-
          Track forward citations (articles citing a paper) and backward citations (reference list) to understand the
          full citation network of any paper.
      - name: Bibliometric Reporting
        description: >-
          Generate citation reports with h-index, total citations, average citations per item, and year-by-year citation
          and publication counts.
      - name: Related Records Discovery
        description: Find research papers related to a given article by identifying records that share cited references.
      - name: Journal Metadata
        description: >-
          Retrieve journal information including ISSN, publisher, subject categories, and Journal Citation Reports
          profile URL.
      - name: Multi-Database Search
        description: Search across 12 Web of Science databases including Core Collection, MEDLINE, BIOSIS, and Zoological Record.
      - name: Times-Cited Counts
        description: Access real-time times-cited counts for documents across Web of Science databases for impact assessment.
  - type: UseCases
    data:
      - name: Literature Review Automation
        description: >-
          Automate systematic literature review by programmatically searching and retrieving bibliographic metadata from
          Web of Science.
      - name: Research Impact Analysis
        description: Analyze the impact of publications or researchers using citation counts, h-index, and bibliometric reports.
      - name: Citation Network Analysis
        description: >-
          Build citation networks by tracing forward and backward citations to map the intellectual lineage of research
          topics.
      - name: Journal Selection
        description: Identify appropriate journals for manuscript submission by searching journal metadata and impact metrics.
